<!DOCTYPE html>
<html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ақылды бағдаршам</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#eef2f7;color:#172033}.wrap{max-width:1250px;margin:auto;padding:24px;display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 8px 28px #1e293b16;margin-bottom:20px}h1{font-size:25px;margin:0 0 18px}h2{font-size:20px;margin:0 0 16px}.badge{font-size:13px;background:#e0edff;color:#17468b;padding:7px 12px;border-radius:20px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.intersection{position:relative;width:100%;aspect-ratio:1;background:#cbd5e1;border-radius:22px;overflow:hidden}.road{position:absolute;background:#525d6d}.road.ns{left:38%;width:24%;height:100%;top:0;border-left:3px solid #fff9;border-right:3px solid #fff9}.road.ew{top:38%;height:24%;width:100%;left:0;border-top:3px solid #fff9;border-bottom:3px solid #fff9}.road.ns:after{content:'';position:absolute;left:50%;top:0;height:100%;border-left:2px dashed #fffc}.road.ew:after{content:'';position:absolute;top:50%;left:0;width:100%;border-top:2px dashed #fffc}.center{position:absolute;left:38%;top:38%;width:24%;height:24%;background:#525d6d;z-index:2}.car{position:absolute;width:28px;height:42px;border-radius:7px;border:2px solid #ffffffaa;background:var(--car);box-shadow:inset 0 8px #ffffff33,0 2px 5px #0004;z-index:3}.car.horizontal{width:42px;height:28px}.car.moving.north{animation:north 1.3s linear infinite}.car.moving.south{animation:south 1.3s linear infinite}.car.moving.west{animation:west 1.3s linear infinite}.car.moving.east{animation:east 1.3s linear infinite}@keyframes north{to{transform:translateY(24px)}}@keyframes south{to{transform:translateY(-24px)}}@keyframes west{to{transform:translateX(24px)}}@keyframes east{to{transform:translateX(-24px)}}.signal{position:absolute;z-index:5;background:#171717;border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 10px #0006}.bulb{width:14px;height:14px;border-radius:50%;opacity:.2}.bulb.on{opacity:1;box-shadow:0 0 8px currentColor}.bulb.red{background:#ef4444;color:#ef4444}.bulb.yellow{background:#facc15;color:#facc15}.bulb.green{background:#22c55e;color:#22c55e}.timer{color:white;font-weight:700;font-size:12px}.direction{position:absolute;z-index:6;background:#000a;color:white;font-size:12px;padding:5px 8px;border-radius:8px}.north-label{top:6px;left:50%;transform:translateX(-50%)}.south-label{bottom:6px;left:50%;transform:translateX(-50%)}.west-label{left:6px;top:50%;transform:translateY(-50%)}.east-label{right:6px;top:50%;transform:translateY(-50%)}button{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600}button.active{background:#172c50;color:white;border-color:#172c50}.controls{display:flex;gap:8px;flex-wrap:wrap}.setting{margin:20px 0}.setting label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}input[type=range]{width:100%;accent-color:#2563eb}.load{border:1px solid #e2e8f0;border-radius:13px;padding:12px;margin:10px 0}.load .row{display:flex;justify-content:space-between;margin-bottom:10px}.load .buttons{display:flex;gap:7px;flex-wrap:wrap}.small{color:#64748b;font-size:14px}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border:1px solid #e2e8f0;border-radius:12px;padding:12px}.result strong{display:block;margin-bottom:5px}.info{background:#f1f5f9;border-radius:12px;padding:15px;margin-top:12px;line-height:1.8}.progress{height:9px;background:#dbe4f0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#2563eb;transition:width .3s}.formula{background:#eff6ff}.footer{font-size:12px;color:#64748b;margin-top:10px}@media(max-width:850px){.wrap{grid-template-columns:1fr;padding:12px}.card{padding:15px}h1{font-size:20px}.car{width:19px;height:29px}.car.horizontal{width:29px;height:19px}.direction{font-size:10px}.signal{padding:3px}.bulb{width:11px;height:11px}}
</style></head><body><main class="wrap"><section><div class="card"><div class="head"><h1>Ақылды бағдаршам: 1 қиылыс</h1><span class="badge" id="modeBadge">Smart Mode</span></div><div class="intersection" id="intersection"><div class="road ns"></div><div class="road ew"></div><div class="center"></div><div id="cars"></div><div id="signals"></div><span class="direction north-label">Солтүстік</span><span class="direction south-label">Оңтүстік</span><span class="direction west-label">Батыс</span><span class="direction east-label">Шығыс</span></div></div></section><section><div class="card"><h2>Басқару панелі</h2><div class="controls"><button id="smart" class="active">Ақылды режим</button><button id="regular">Қалыпты режим</button></div><div class="setting"><label><span>Жалпы цикл уақыты</span><span id="cycleLabel">90 сек</span></label><input id="cycle" type="range" min="40" max="140" step="2" value="90"></div><div id="loadControls"></div></div><div class="card"><h2>Есептеу нәтижесі</h2><div class="results" id="results"></div><div class="info" id="phaseInfo"></div><div class="info" id="timingInfo"></div><div class="info formula"><strong>Формула</strong><div>t_NS = (T − 2·3) × n_NS / (n_NS + n_EW)</div><div>t_EW = (T − 2·3) × n_EW / (n_NS + n_EW)</div></div><div class="footer">Бұл — көлік жүктемесін шартты түрде модельдейтін оқу симуляторы.</div></div></section></main>
<script>
const colors={green:{label:'Жасыл',cars:10,hex:'#22c55e'},yellow:{label:'Сары',cars:20,hex:'#facc15'},red:{label:'Қызыл',cars:30,hex:'#ef4444'}};
const directions=[['north','Солтүстік'],['south','Оңтүстік'],['west','Батыс'],['east','Шығыс']];
const loads={north:'red',south:'yellow',west:'green',east:'red'};
let mode='smart',totalCycle=90,phase='NS',lightState='green',countdown=10,timings;
function calculate(){const yellow=3,usable=totalCycle-2*yellow,ns=colors[loads.north].cars+colors[loads.south].cars,ew=colors[loads.east].cars+colors[loads.west].cars;if(mode==='regular'){const half=Math.max(10,Math.round(usable/2));return {nsGreen:half,ewGreen:half,yellow,ns,ew}}let ng=Math.round(usable*ns/(ns+ew));ng=Math.max(10,Math.min(usable-10,ng));return {nsGreen:ng,ewGreen:usable-ng,yellow,ns,ew}}
function reset(){timings=calculate();phase='NS';lightState='green';countdown=timings.nsGreen;render()}
function render(){document.getElementById('modeBadge').textContent=mode==='smart'?'Smart Mode':'Regular Mode';document.getElementById('smart').classList.toggle('active',mode==='smart');document.getElementById('regular').classList.toggle('active',mode==='regular');document.getElementById('cycleLabel').textContent=totalCycle+' сек';document.getElementById('loadControls').innerHTML=directions.map(([key,label])=>`<div class="load"><div class="row"><strong>${label}</strong><span>${colors[loads[key]].label}</span></div><div class="buttons">${Object.entries(colors).map(([c,v])=>`<button class="${loads[key]===c?'active':''}" data-dir="${key}" data-load="${c}">${v.label}</button>`).join('')}</div></div>`).join('');document.getElementById('results').innerHTML=directions.map(([key,label])=>`<div class="result"><strong>${label}</strong><div class="small">Түс: ${colors[loads[key]].label}</div><div class="small">Шартты көлік саны: ${colors[loads[key]].cars}</div></div>`).join('');document.getElementById('phaseInfo').innerHTML=`<strong>Фаза жүктемелері</strong><div>NS = ${colors[loads.north].cars} + ${colors[loads.south].cars} = <b>${timings.ns}</b></div><div>EW = ${colors[loads.east].cars} + ${colors[loads.west].cars} = <b>${timings.ew}</b></div>`;document.getElementById('timingInfo').innerHTML=`<strong>Бағдаршам уақыты</strong><div>NS жасыл: <b>${timings.nsGreen} сек</b></div><div class="progress"><div class="fill" style="width:${timings.nsGreen/totalCycle*100}%"></div></div><div>EW жасыл: <b>${timings.ewGreen} сек</b></div><div class="progress"><div class="fill" style="width:${timings.ewGreen/totalCycle*100}%"></div></div><div class="small">Сары шам: ${timings.yellow} сек</div>`;renderTraffic()}
function renderTraffic(){const positions={north:{x:43,y:7,dx:0,dy:8},south:{x:53,y:75,dx:0,dy:8},west:{x:7,y:53,dx:9,dy:0},east:{x:75,y:43,dx:9,dy:0}};document.getElementById('cars').innerHTML=directions.map(([key])=>{const p=positions[key],active=(key==='north'||key==='south'?phase==='NS':phase==='EW')&&lightState==='green';return Array.from({length:4},(_,i)=>{const x=p.x+i*p.dx,y=p.y+i*p.dy;return `<div class="car ${key==='west'||key==='east'?'horizontal':''} ${active?'moving '+key:''}" style="left:${x}%;top:${y}%;--car:${colors[loads[key]].hex};animation-delay:${i*.12}s"></div>`}).join('')}).join('');const activeNS=phase==='NS'?lightState:'red',activeEW=phase==='EW'?lightState:'red';const sig=(x,y,state,time)=>`<div class="signal" style="left:${x}%;top:${y}%">${['red','yellow','green'].map(c=>`<div class="bulb ${c} ${state===c?'on':''}"></div>`).join('')}<div class="timer">${time}</div></div>`;document.getElementById('signals').innerHTML=sig(34,26,activeNS,phase==='NS'?countdown:0)+sig(63,63,activeNS,phase==='NS'?countdown:0)+sig(25,62,activeEW,phase==='EW'?countdown:0)+sig(65,28,activeEW,phase==='EW'?countdown:0)}
document.getElementById('smart').onclick=()=>{mode='smart';reset()};document.getElementById('regular').onclick=()=>{mode='regular';reset()};document.getElementById('cycle').oninput=e=>{totalCycle=Number(e.target.value);reset()};document.getElementById('loadControls').onclick=e=>{const b=e.target.closest('button[data-dir]');if(!b)return;loads[b.dataset.dir]=b.dataset.load;reset()};setInterval(()=>{if(countdown>1)countdown--;else if(lightState==='green'){lightState='yellow';countdown=timings.yellow}else if(phase==='NS'){phase='EW';lightState='green';countdown=timings.ewGreen}else{phase='NS';lightState='green';countdown=timings.nsGreen}renderTraffic()},1000);reset();
</script></body></html>
